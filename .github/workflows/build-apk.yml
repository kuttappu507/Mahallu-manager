name: Build Mahallu Manager APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"
      
      - name: Verify APK
        run: |
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK_PATH" ]; then
            echo "APK size: $(du -h $APK_PATH | cut -f1)"
            echo "MD5: $(md5sum $APK_PATH | cut -d' ' -f1)"
            echo "SHA256: $(sha256sum $APK_PATH | cut -d' ' -f1)"
          else
            echo "APK build FAILED - $APK_PATH not found"
            find . -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
      
      - name: Wrap APK in ZIP (for distribution)
        run: |
          cd app/build/outputs/apk/debug
          zip -r ../../../../MahalluManager-APK.zip app-debug.apk
          echo "ZIP size: $(du -h ../../../../MahalluManager-APK.zip | cut -f1)"
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MahalluManager-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            MahalluManager-APK.zip
          retention-days: 30
